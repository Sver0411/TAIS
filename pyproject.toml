[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tais-research"
version = "0.1.0"
description = "Trust-gated adaptive sampling research prototype"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "numpy>=1.26", "pandas>=2", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tais = ["*.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
