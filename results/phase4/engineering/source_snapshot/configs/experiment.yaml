  - 48
  - 49
  event_match_tolerance_s: 5
  bootstrap_replicates: 2000
  confidence_level: 0.95
  threshold_multipliers:
  - 0.75
  - 1.0
  - 1.5
  fault_recovery_attribution_s: 120
