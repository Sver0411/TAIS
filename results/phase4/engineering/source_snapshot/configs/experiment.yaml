# Frozen before independent test. Baseline thresholds/ladders loaded from pinned upstream.
project:
  name: TAIS
  version: 0.1.0
  random_seed: 42
sampling:
  min_interval_s: 5
  default_interval_s: 20
  max_interval_s: 60
  fixed_baselines_s:
  - 5
  - 10
  - 20
  - 40
  - 60
  heartbeat_s: 60
trust:
