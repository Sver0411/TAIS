  - TAIS
greenhouse:
  dataset_doi: 10.17632/54htxm94bv.1
  source_url: https://data.mendeley.com/datasets/54htxm94bv/1
  expected_resolution_minutes: 5
  include_raw_data_in_git: false
channels:
  temperature:
    trust:
      min_value: -40
      max_value: 85
      stuck_epsilon: 0.01
      stuck_window: 20
      spike_threshold: 5
      drift_window: 24
      drift_threshold: 0.01
      missing_limit: 3
  humidity:
    trust:
      min_value: 0
      max_value: 100
      stuck_epsilon: 0.01
      stuck_window: 20
      spike_threshold: 20
      drift_window: 24
      drift_threshold: 0.01
      missing_limit: 3
synthetic:
  duration_s: 1800
  baseline:
    temperature: 24
    humidity: 45
  background_amplitude:
    temperature: 0.03
    humidity: 0.1
  background_period_s: 1200
  noise_sigma:
    temperature: 0.08
    humidity: 0.4
  event_amplitude:
    temperature: 4
    humidity: 16
  event_ramp_s: 5
  event_delay_s: 60
  fault_start_s: 600
  fault_jitter_s: 30
  fault_seed_offset: 100000
  range_value: 100
  spike_amplitude: 12
  drift_per_second: 0.015
  offset_amplitude: 1.5
  profiles:
    short:
      fault_duration_s: 240
      event_duration_s: 26
      intensity: 1
    long:
      fault_duration_s: 600
      event_duration_s: 180
      intensity: 2
