name: Paper evidence checks
on: [push, pull_request, workflow_dispatch]
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-build-isolation
      - run: python -m pytest tests/test_paper_baselines.py -q
      - run: python scripts/verify_paper.py
      - run: python scripts/benchmark_paper.py smoke --output-root results/scratch/ci-paper --archive-root results/scratch/ci-paper-archive
