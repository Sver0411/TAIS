name: Module ablation research checks
on: [push, pull_request, workflow_dispatch]
jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-build-isolation
      - run: python -m pytest tests/test_module_ablation.py -q
      - run: python scripts/verify_ablation.py
      - run: python scripts/benchmark_ablation.py engineering --out results/scratch/ci-module-ablation --workers 2
      - run: python scripts/analyze_ablation.py --root results/scratch/ci-module-ablation --phase engineering
