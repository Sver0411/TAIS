name: Reproducible research checks
on: [push, pull_request, workflow_dispatch]
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install -e . --no-build-isolation
      - run: python -m pytest -q
      - run: python scripts/reproduce_baseline.py
      - run: python scripts/run_experiments.py --split development --smoke
      - run: python scripts/summarize_results.py --split development-smoke
